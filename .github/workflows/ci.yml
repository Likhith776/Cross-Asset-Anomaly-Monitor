name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile all sources (syntax gate incl. Airflow DAGs)
        run: python -m compileall -q src dashboard scripts dags

      - name: Run test suite
        run: pytest -v
