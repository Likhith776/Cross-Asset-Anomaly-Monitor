services:
  kafka:
    # Single-node KRaft mode — no Zookeeper required
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVhNzNFRTBBNDA1Qg"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - anomaly-net

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: market_anomalies
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_anomalies"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - anomaly-net

  fastapi:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/market_anomalies"
      DEMO_DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/market_anomalies_demo"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anomaly-net
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro


  streamlit:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://fastapi:8000
    depends_on:
      - fastapi
    networks:
      - anomaly-net
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: src/producers/Dockerfile
    container_name: producer
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      METRICS_HTTP_PORT: 9101
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - anomaly-net
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro


  feature-consumer:
    build:
      context: .
      dockerfile: src/consumers/Dockerfile
    container_name: feature-consumer
    command: python -m src.consumers.feature_consumer
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/market_anomalies"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      METRICS_HTTP_PORT: 9102
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anomaly-net
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro


  anomaly-consumer:
    build:
      context: .
      dockerfile: src/consumers/Dockerfile
    container_name: anomaly-consumer
    command: python -m src.consumers.anomaly_consumer
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/market_anomalies"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      METRICS_HTTP_PORT: 9103
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - anomaly-net
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro


  scheduler:
    build:
      context: .
      dockerfile: src/detection/Dockerfile
    container_name: scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/market_anomalies"
      DEMO_DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/market_anomalies_demo"
      METRICS_HTTP_PORT: 9104
    volumes:
      - ./config:/app/config:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anomaly-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - anomaly-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - anomaly-net
    restart: unless-stopped

networks:
  anomaly-net:
    driver: bridge

volumes:
  pgdata:
    name: anomaly-pgdata
  backups:
    name: anomaly-backups
  grafana-data:
    name: anomaly-grafana